[build-system]
requires = ["setuptools>=77", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.12"
name = "django-qgis-access"
authors = [
    {name = "OPENGIS.ch", email = "info@opengis.ch"},
]
description = "Hand QGIS users a project and an authentication file for your Django site, with per-user API keys"
readme = "README.md"
keywords = ["django", "qgis", "api key", "authentication", "oapif"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
license = "MIT"
dependencies = ["django>=5.2"]
dynamic = ["version"]

[project.optional-dependencies]
ninja = ["django-ninja>=1.0"]
drf = ["djangorestframework>=3.15"]
dev = ["pre-commit"]

[project.urls]
homepage = "https://github.com/opengisch/django-qgis-access"
repository = "https://github.com/opengisch/django-qgis-access"
tracker = "https://github.com/opengisch/django-qgis-access/issues"

[tool.setuptools.packages.find]
include = ["django_qgis_access*"]

[tool.setuptools.package-data]
django_qgis_access = ["templates/django_qgis_access/*"]

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.0.0.dev"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "django_qgis_access/migrations/*",
]
lint.pydocstyle.convention = "google"
lint.fixable = ["ALL"]
lint.extend-select = ["UP"]
# Django declares its options as mutable class attributes
lint.extend-ignore = ["RUF012"]
format.preview = true
